{% extends "base.html" %}
{% block title %}Reschedule Booking{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm p-4 bg-white border-0">
            <h4 class="text-primary mb-3">Reschedule Student Booking #{{ booking.id }}</h4>
            <p class="text-muted">Current Exam: <strong>{{ booking.exam.exam_title }}</strong></p>
            <form method="POST" action="{{ url_for('admin_reschedule_booking', id=booking.id) }}">
                <div class="mb-3">
                    <label class="form-label fw-bold">Select New Open Exam Slot</label>
                    <select name="new_exam_id" class="form-select" required>
                        {% for ex in exams %}
                        <option value="{{ ex.id }}">{{ ex.exam_title }} ({{ ex.exam_date.strftime('%Y-%m-%d') }}) - {{ ex.available_seats }} seats left</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-semibold text-white">Confirm Rescheduling</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
