{% extends "base.html" %}
{% block title %}Edit Course - Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <h4 class="text-primary mb-3">Edit Academic Course</h4>
            <form method="POST" action="{{ url_for('admin_edit_course', id=course.id) }}">
                <div class="mb-3">
                    <label class="form-label fw-bold">Course Code</label>
                    <input type="text" name="course_code" class="form-control" value="{{ course.course_code }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Course Name</label>
                    <input type="text" name="course_name" class="form-control" value="{{ course.course_name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Department</label>
                    <input type="text" name="department" class="form-control" value="{{ course.department }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Course Description</label>
                    <textarea name="description" class="form-control" rows="3">{{ course.description }}</textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary-custom flex-grow-1">Update Course</button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
