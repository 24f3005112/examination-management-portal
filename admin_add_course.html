{% extends "base.html" %}
{% block title %}Add Course - Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <h4 class="text-primary mb-3">Add New Academic Course</h4>
            <form method="POST" action="{{ url_for('admin_add_course') }}">
                <div class="mb-3">
                    <label class="form-label fw-bold">Course Code</label>
                    <input type="text" name="course_code" class="form-control" placeholder="e.g. CS101" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Course Name</label>
                    <input type="text" name="course_name" class="form-control" placeholder="e.g. Data Structures" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Department</label>
                    <input type="text" name="department" class="form-control" placeholder="e.g. Computer Science" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Course Description</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="Course syllabus overview..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100">Save Course</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
