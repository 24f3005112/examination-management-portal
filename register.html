{% extends "base.html" %}
{% block title %}Register - Examination Portal{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6">
        <div class="card shadow-sm border">
            <div class="card-body p-4">
                <h4 class="mb-4 text-primary">Create New Account</h4>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Enter full name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter institutional email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Choose a secure password" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Department</label>
                        <input type="text" name="department" class="form-control" placeholder="e.g. Computer Science" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Roll Number (Students Only)</label>
                        <input type="text" name="roll_no" class="form-control" placeholder="e.g. CS2026001">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Contact Details</label>
                        <input type="text" name="contact_details" class="form-control" placeholder="Phone number" required>
                    </div>

                    <div class="mb-4">
                        <label class="d-block mb-2 fw-bold">Select Role:</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="role" value="student" id="role_stud" checked>
                            <label class="form-check-label" for="role_stud">Student</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="role" value="examiner" id="role_exam">
                            <label class="form-check-label" for="role_exam">Examiner</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2">Register Account</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
